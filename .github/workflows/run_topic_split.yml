name: Run Topic Split

on:
  workflow_dispatch:

jobs:
  split-topics:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run topic split
        run: python split_topics.py
